<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#008000">

    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
    <link rel="icon" href="./assets/favicon.png" type="image/png">

    <title>Select Arena | Shambhu Playing Arena</title>
    <meta name="description"
        content="Choose between Shambhu Playing Arena and Shambhu Playing Arena 2.0 in New Delhi." />

    <link rel="stylesheet" href="./output.css">
</head>

<body class="m-0 p-0 box-border h-screen w-screen overflow-hidden flex flex-col md:flex-row font-sans">

    <!-- Arena 1 (Left / Top) -->
    <a href="./shambhu-playing-arena.html"
        class="relative flex-1 flex flex-col items-center justify-center bg-brand-green text-white p-8 group hover:bg-brand-darkgreen transition-all duration-500 no-underline outline-none border-b-4 md:border-b-0 md:border-r-4 border-brand-darkgreen/30">

        <!-- Logo -->
        <img src="./assets/logo.webp" alt="Shambhu Playing Arena Logo"
            class="w-28 h-28 md:w-40 md:h-40 rounded-full border-4 border-white shadow-2xl mb-6 object-cover transform group-hover:scale-110 transition-transform duration-700 ease-out">

        <!-- Title -->
        <h2 class="font-serif-title text-2xl md:text-4xl font-bold tracking-widest text-center mb-2 drop-shadow-md">
            SHAMBHU PLAYING<br />ARENA
        </h2>
        <p class="text-white/80 text-sm md:text-base tracking-wider mb-8 font-medium">D BLOCK, KAPASHERA</p>

        <!-- Call to Action -->
        <span
            class="px-8 py-3 border-2 border-white rounded-full text-sm font-bold uppercase tracking-widest bg-transparent group-hover:bg-white group-hover:text-brand-green transition-colors duration-300 shadow-lg">
            Select Arena 1
        </span>
    </a>

    <!-- Arena 2.0 (Right / Bottom) -->
    <a href="./shambhu-playing-arena-2.html"
        class="relative flex-1 flex flex-col items-center justify-center bg-gray-50 text-brand-green p-8 group hover:bg-white transition-all duration-500 no-underline outline-none">

        <!-- Logo -->
        <img src="./assets/logo-2.webp" alt="Shambhu Playing Arena 2.0 Logo"
            class="w-28 h-28 md:w-40 md:h-40 rounded-full border-4 border-brand-green shadow-2xl mb-6 object-cover transform group-hover:scale-110 transition-transform duration-700 ease-out">

        <!-- Title -->
        <h2
            class="font-serif-title text-2xl md:text-4xl font-bold tracking-widest text-center mb-2 text-brand-darkgreen drop-shadow-sm">
            SHAMBHU PLAYING<br />ARENA 2.0
        </h2>
        <p class="text-gray-500 text-sm md:text-base tracking-wider mb-8 font-medium">KAPASHERA EXTENSION</p>

        <!-- Call to Action -->
        <span
            class="px-8 py-3 border-2 border-brand-green rounded-full text-sm font-bold uppercase tracking-widest bg-transparent group-hover:bg-brand-green group-hover:text-white transition-colors duration-300 shadow-lg">
            Select Arena 2
        </span>
    </a>

</body>

</html>
